<div class="auth-wrapper">
  <!-- Back Button -->
  <a routerLink="/" class="back-home-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Home
  </a>

  <!-- Animated Background Elements -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="auth-card-container">
    <div class="auth-card glass-panel">
      <div class="auth-header">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            <circle cx="12" cy="14" r="2"></circle>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join the future of professional hiring</p>
      </div>

      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <!-- Segmented Control for Role -->
      <div class="role-selector">
        <button type="button" class="role-btn" [class.active]="role === 'CANDIDATE'" (click)="selectRole('CANDIDATE')">
          <span class="role-icon">👤</span> Candidate
        </button>
        <button type="button" class="role-btn" [class.active]="role === 'RECRUITER'" (click)="selectRole('RECRUITER')">
          <span class="role-icon">🧑‍💼</span> Recruiter
        </button>
      </div>

      <form class="auth-form" (ngSubmit)="onRegister()">
        
        <div class="floating-input-group">
          <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" required placeholder=" " />
          <label for="fullName">Full Name</label>
        </div>

        <div class="floating-input-group">
          <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder=" " />
          <label for="email">Email Address</label>
        </div>

        <div class="otp-section">
          <button type="button" class="btn-otp" (click)="onRequestOtp()" [disabled]="isOtpLoading || !email">
            <span *ngIf="!isOtpLoading">Send Verification Code</span>
            <span *ngIf="isOtpLoading" class="loader small"></span>
          </button>
          <div class="help-text" *ngIf="otpSentMessage">{{ otpSentMessage }}</div>
          <div class="error-text" *ngIf="otpError">{{ otpError }}</div>
        </div>

        <div class="floating-input-group">
          <input type="text" id="otp" [(ngModel)]="otp" name="otp" required placeholder=" " />
          <label for="otp">Enter Verification Code</label>
        </div>

        <div class="floating-input-group">
          <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder=" " />
          <label for="password">Create Password</label>
        </div>

        <button type="submit" class="btn-primary-auth" [disabled]="isLoading">
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>

      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <div class="social-auth">
        <button class="social-btn google" type="button" (click)="continueWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="social-btn github" type="button" (click)="continueWithGitHub()">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.42-4.04-1.42-.55-1.38-1.34-1.74-1.34-1.74-1.1-.74.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.08 1.84 2.83 1.31 3.52 1 .11-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.31-.54-1.55.12-3.24 0 0 1.01-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.69.24 2.93.12 3.24.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/></svg>
          GitHub
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Sign In</a>
      </div>
    </div>
  </div>
</div>

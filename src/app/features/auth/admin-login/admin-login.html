<div class="admin-login-container">
  <div class="admin-login-card">
    <!-- Admin Header -->
    <div class="admin-header">
      <div class="admin-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
          <path d="M12 8v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
      </div>
      <h1>Admin Access</h1>
      <p class="admin-subtitle">Enter your administrator credentials</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Admin Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@hireconnect.com"
            required
            autocomplete="username"
          />
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-10 5L2 7"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your admin password"
            required
            autocomplete="current-password"
          />
          <div class="input-icon password-toggle" (click)="togglePasswordVisibility()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle *ngIf="!showPassword" cx="12" cy="12" r="3"/>
              <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div *ngIf="successMessage" class="message success">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="message error">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="login-btn"
      >
        <span *ngIf="!isLoading">Access Admin Panel</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          Authenticating...
        </span>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="login-footer">
      <button type="button" class="back-link" (click)="goToRegularLogin()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5"/>
          <path d="m12 19-7-7 7-7"/>
        </svg>
        Back to User Login
      </button>
    </div>

    <!-- Security Notice -->
    <div class="security-notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
      </svg>
      <span>This is a restricted area. Unauthorized access is prohibited.</span>
    </div>
  </div>
</div>

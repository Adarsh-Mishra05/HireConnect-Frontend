[build]
  base = "."
  command = "npm run build"
  publish = "dist/hireconnect-frontend/browser"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/*"
  to = "http://107.22.130.57:8080/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "http://107.22.130.57:8080/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/oauth2/*"
  to = "http://107.22.130.57:8080/login/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[functions]
  node_bundler = "esbuild"
